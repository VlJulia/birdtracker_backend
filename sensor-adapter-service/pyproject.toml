[project]
name = "sensor-adapter-service"
version = "0.1.0"
description = "Приём бинарных пакетов с трекеров"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.29.0",
    "crcmod>=1.7",
    "fastapi>=0.115.12",
    "pydantic>=2.11.2",
    "pydantic-settings>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.alembic]
script_location = "migrations"
prepend_sys_path = ["."]
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s"
