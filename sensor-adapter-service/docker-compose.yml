version: '3.8'

services:
  sensor-adapter:
    build: .
    ports:
      - "8002:${APP_PORT}"       # HTTP API
      - "9999:${APP_TCP_PORT}"       # TCP сервер
      - "9998:${APP_UDP_PORT}/udp"       # UDP сервер
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests
      - ./migrations:/code/migrations
    env_file:
      - ./.env
    depends_on:
      sensor_adapter_db:
        condition: service_healthy
    networks:
      - shared-net

  sensor_adapter_db:
    image: postgres:15
    restart: always
    env_file:
      - ./.env
    volumes:
      - postgres_data_sensors:/var/lib/postgresql/data
    ports:
      - "5435:${POSTGRES_PORT}"
    networks:
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data_sensors:

networks:
  shared-net:
    external: true