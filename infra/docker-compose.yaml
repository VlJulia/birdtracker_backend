version: "3.9"

services:
  web_db:
    image: postgres:15
    restart: always
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared-net
    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      web_db:
        condition: service_healthy
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - ./.env
    volumes:
      - ../backend:/app/
    networks:
      - shared-net
    working_dir: /app
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host=${APP_HOST} --port=${APP_PORT} --reload --reload-dir app"

volumes:
  postgres_data:

networks:
  shared-net:
    external: true